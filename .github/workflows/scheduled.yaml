name: Scheduled Deployments ⏲

on:
  schedule:
    - cron: '44 19 5,20 * *'
  workflow_dispatch:

jobs:
  create-release:
    name: Create release 🌟
    runs-on: ubuntu-latest
    steps:
      - name: Generate release body 📜
        id: release-body
        run: |
          printf "Release $(date +"%Y.%m.%d")\n\n"\
          "You may view the artifacts in this release for more information "\
          "about the images that were published." > RELEASE_BODY.txt
          echo "release-tag=$(date +"%Y.%m.%d")" >> $GITHUB_OUTPUT

      - name: Create release 🌟
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          body_path: RELEASE_BODY.txt
          token: ${{ secrets.REPO_GITHUB_TOKEN }}
          generate_release_notes: true
          tag_name: ${{ steps.release-body.outputs.release-tag }}

    outputs:
      release_tag: ${{ steps.release-body.outputs.release-tag }}

  build:
    name: Build & Deploy 🚀
    needs: create-release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image:
          - distro_tag: '4.6.1'
            bioc: '3.23'
            distro: rstudio-local
            origin: rocker
          - distro_tag: '4.6.1'
            bioc: '3.23'
            distro: rstudio
            origin: rocker
          # TODO: the rhub-based images are temporarily disabled while their
          # builds are failing. Re-enable once they build again.
          # - distro_tag: 'latest'
          #   bioc: 'devel'
          #   distro: gcc13
          #   origin: rhub
          # - distro_tag: 'latest'
          #   bioc: 'devel'
          #   distro: gcc14
          #   origin: rhub
          # - distro_tag: 'latest'
          #   bioc: 'devel'
          #   distro: atlas
          #   origin: rhub
          # - distro_tag: 'latest'
          #   bioc: 'devel'
          #   distro: valgrind
          #   origin: rhub
          # - distro_tag: 'latest'
          #   bioc: 'devel'
          #   distro: intel
          #   origin: rhub
          # - distro_tag: 'latest'
          #   bioc: 'devel'
          #   distro: nosuggests
          #   origin: rhub
          # - distro_tag: 'latest'
          #   bioc: 'devel'
          #   distro: mkl
          #   origin: rhub

    # Trigger steps
    steps:
      - name: Checkout repository 💳
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: main

      - name: Trigger all builds ▶️
        uses: peter-evans/repository-dispatch@ff45666b9427631e3450c54a1bcbee4d9ff4d7c0 # v3
        with:
          token: ${{ secrets.REPO_GITHUB_TOKEN }}
          event-type: scheduled
          client-payload: >
            {
              "origin": "${{ matrix.image.origin }}",
              "distribution": "${{ matrix.image.distro }}",
              "r_version": "${{ matrix.image.distro_tag }}",
              "bioc_version": "${{ matrix.image.bioc }}",
              "latest_r_version": "4.6.1",
              "latest_bioc_version": "3.23",
              "tag": "",
              "tag_latest": "true",
              "release_tag": "${{ needs.create-release.outputs.release_tag }}"
            }
